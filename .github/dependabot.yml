version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-non-major:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /Forensics_Timeline_Builder
    schedule:
      interval: weekly
    groups:
      forensics-python-non-major:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /Mini_SOC_Workbench
    schedule:
      interval: weekly
    groups:
      minisoc-python-non-major:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
