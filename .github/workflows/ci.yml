name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install -e .
          fi
          if [[ -f Forensics_Timeline_Builder/requirements.txt ]]; then
            python -m pip install -r Forensics_Timeline_Builder/requirements.txt
          fi
          if [[ -f Mini_SOC_Workbench/pyproject.toml ]]; then
            python -m pip install -e Mini_SOC_Workbench
          fi
          if [[ -f AI_Malware_Analyzer/requirements.txt ]]; then
            python -m pip install -r AI_Malware_Analyzer/requirements.txt
          fi
          python -m pip install pytest

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if find . -path './.git' -prune -o -path './.venv' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No Python test files found; compile check completed."
          fi
